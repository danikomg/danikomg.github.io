<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="900" fill="#ffffff"/>

  <!-- Step 1 -->
  <rect x="175" y="20" width="550" height="64" rx="10" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="450" y="46" text-anchor="middle" font-size="15" font-weight="600" fill="#0b3d68">Gatilho agendado</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#3a4a58">Toda quinta-feira, às 10h15</text>
  <line x1="450" y1="84" x2="450" y2="114" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="175" y="116" width="550" height="64" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Lê o calendário editorial</text>
  <text x="450" y="162" text-anchor="middle" font-size="13" fill="#3a4a58">Planilha (Google Sheets) — filtra itens marcados "a publicar"</text>
  <line x1="450" y1="180" x2="450" y2="210" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="175" y="212" width="550" height="64" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Extrai o artigo do blog</text>
  <text x="450" y="258" text-anchor="middle" font-size="13" fill="#3a4a58">Busca o conteúdo correspondente à linha selecionada</text>
  <line x1="450" y1="276" x2="450" y2="306" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="175" y="308" width="550" height="64" rx="10" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="450" y="334" text-anchor="middle" font-size="15" font-weight="600" fill="#0b3d68">IA gera a legenda</text>
  <text x="450" y="354" text-anchor="middle" font-size="13" fill="#3a4a58">+ segunda passada de IA para revisar estilo e maneirismos</text>
  <line x1="450" y1="372" x2="450" y2="402" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="175" y="404" width="550" height="64" rx="10" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="450" y="430" text-anchor="middle" font-size="15" font-weight="600" fill="#0b3d68">IA gera a arte de capa</text>
  <text x="450" y="450" text-anchor="middle" font-size="13" fill="#3a4a58">Imagem gerada a partir do conteúdo do post</text>
  <line x1="450" y1="468" x2="450" y2="498" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="175" y="500" width="550" height="64" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="526" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Upload e atualização de status</text>
  <text x="450" y="546" text-anchor="middle" font-size="13" fill="#3a4a58">Ativos vão para o Drive · planilha muda para "em revisão"</text>
  <line x1="450" y1="564" x2="450" y2="594" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7: Slack approval -->
  <rect x="150" y="596" width="600" height="70" rx="10" fill="#fff8e6" stroke="#c9a227" stroke-width="2"/>
  <text x="450" y="624" text-anchor="middle" font-size="15" font-weight="600" fill="#6b5300">Aprovação humana no Slack</text>
  <text x="450" y="646" text-anchor="middle" font-size="13" fill="#3a4a58">Botões: Aprovar · Pedir ajuste</text>

  <!-- Fork -->
  <line x1="330" y1="666" x2="250" y2="706" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="666" x2="650" y2="706" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Outcome: approved -->
  <rect x="80" y="708" width="340" height="64" rx="10" fill="#e9f7ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="250" y="734" text-anchor="middle" font-size="15" font-weight="600" fill="#1e5c24">Publicado no LinkedIn</text>
  <text x="250" y="754" text-anchor="middle" font-size="13" fill="#3a4a58">Planilha é atualizada para "publicado"</text>

  <!-- Outcome: rejected -->
  <rect x="480" y="708" width="340" height="64" rx="10" fill="#fdeeee" stroke="#b3261e" stroke-width="2"/>
  <text x="650" y="734" text-anchor="middle" font-size="15" font-weight="600" fill="#7a1a15">Retorna para ajuste</text>
  <text x="650" y="754" text-anchor="middle" font-size="13" fill="#3a4a58">Planilha é atualizada para "reprovado"</text>

  <!-- Legend -->
  <rect x="175" y="820" width="16" height="16" rx="3" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="200" y="833" font-size="13" fill="#3a4a58">Etapa com IA generativa</text>
  <rect x="400" y="820" width="16" height="16" rx="3" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="425" y="833" font-size="13" fill="#3a4a58">Etapa mecânica / integração</text>
  <rect x="640" y="820" width="16" height="16" rx="3" fill="#fff8e6" stroke="#c9a227" stroke-width="2"/>
  <text x="665" y="833" font-size="13" fill="#3a4a58">Ponto de decisão humana</text>
</svg>
