<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="14" fill="#57606a">Roda em todo o acervo do blog — primeira rodada: 317 URLs</text>

  <!-- Step 1 -->
  <rect x="175" y="56" width="550" height="70" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Extração de dados de performance</text>
  <text x="450" y="105" text-anchor="middle" font-size="13" fill="#3a4a58">Por URL, via Google Search Console (cliques, impressões, posição) e GA4 (tráfego, engajamento)</text>
  <line x1="450" y1="126" x2="450" y2="156" stroke="#57606a" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 2 -->
  <rect x="175" y="158" width="550" height="64" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Análise on-page automatizada</text>
  <text x="450" y="204" text-anchor="middle" font-size="13" fill="#3a4a58">Hierarquia de headings, presença de FAQ/schema, template</text>
  <line x1="450" y1="222" x2="450" y2="252" stroke="#57606a" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 3 -->
  <rect x="175" y="254" width="550" height="70" rx="10" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="450" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#0b3d68">Avaliação de potencial via IA</text>
  <text x="450" y="303" text-anchor="middle" font-size="13" fill="#3a4a58">Cruza os dados para apontar oportunidades (ex: boa posição, baixo CTR)</text>
  <line x1="450" y1="324" x2="450" y2="354" stroke="#57606a" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 4 -->
  <rect x="175" y="356" width="550" height="70" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="384" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Consolidação em planilha estruturada</text>
  <text x="450" y="405" text-anchor="middle" font-size="13" fill="#3a4a58">Uma linha por URL, com métricas e diagnósticos organizados</text>
  <line x1="450" y1="426" x2="450" y2="456" stroke="#57606a" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Outcome -->
  <rect x="150" y="458" width="600" height="70" rx="10" fill="#fff8e6" stroke="#c9a227" stroke-width="2"/>
  <text x="450" y="486" text-anchor="middle" font-size="15" font-weight="600" fill="#6b5300">Alimenta a rotina mensal de atualização de conteúdo</text>
  <text x="450" y="507" text-anchor="middle" font-size="13" fill="#3a4a58">Escolha manual de artigos — decisão editorial continua humana</text>

  <!-- Legend -->
  <rect x="175" y="580" width="16" height="16" rx="3" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="200" y="593" font-size="13" fill="#3a4a58">Etapa mecânica / integração</text>
  <rect x="400" y="580" width="16" height="16" rx="3" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="425" y="593" font-size="13" fill="#3a4a58">Etapa com IA generativa</text>
  <rect x="600" y="580" width="16" height="16" rx="3" fill="#fff8e6" stroke="#c9a227" stroke-width="2"/>
  <text x="625" y="593" font-size="13" fill="#3a4a58">Ponto de decisão humana</text>
</svg>
