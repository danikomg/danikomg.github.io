<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="800" fill="#ffffff"/>

  <!-- Step 1 -->
  <rect x="175" y="20" width="550" height="64" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="46" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Gatilho agendado</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#3a4a58">Toda segunda-feira, às 7h</text>
  <line x1="450" y1="84" x2="450" y2="114" stroke="#57606a" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 2 -->
  <rect x="175" y="116" width="550" height="70" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Lê o sitemap do blog</text>
  <text x="450" y="165" text-anchor="middle" font-size="13" fill="#3a4a58">Extrai e normaliza as URLs já publicadas, para comparação de gap</text>
  <line x1="450" y1="186" x2="450" y2="216" stroke="#57606a" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 3 -->
  <rect x="175" y="218" width="550" height="76" rx="10" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="450" y="246" text-anchor="middle" font-size="15" font-weight="600" fill="#0b3d68">IA gera territórios adjacentes</text>
  <text x="450" y="267" text-anchor="middle" font-size="13" fill="#3a4a58">A partir dos núcleos temáticos já cobertos, sugere 12 novos</text>
  <text x="450" y="285" text-anchor="middle" font-size="13" fill="#3a4a58">territórios de palavra-chave ainda não explorados</text>
  <line x1="450" y1="294" x2="450" y2="324" stroke="#57606a" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 4 -->
  <rect x="175" y="326" width="550" height="70" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="354" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Expande cada território em variações</text>
  <text x="450" y="375" text-anchor="middle" font-size="13" fill="#3a4a58">Perguntas, conectores e ordem alfabética — dezenas de buscas por termo</text>
  <line x1="450" y1="396" x2="450" y2="426" stroke="#57606a" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 5 -->
  <rect x="175" y="428" width="550" height="70" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="456" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Consulta o autocomplete do Google</text>
  <text x="450" y="477" text-anchor="middle" font-size="13" fill="#3a4a58">Uma requisição por variação, com throttle para evitar bloqueio</text>
  <line x1="450" y1="498" x2="450" y2="528" stroke="#57606a" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 6 -->
  <rect x="175" y="530" width="550" height="76" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="558" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Filtra o gap e pontua por demanda</text>
  <text x="450" y="579" text-anchor="middle" font-size="13" fill="#3a4a58">Remove o que já é coberto pelo site, conta frequência das sugestões</text>
  <text x="450" y="597" text-anchor="middle" font-size="13" fill="#3a4a58">e classifica em tiers (T1, T2, T3)</text>
  <line x1="450" y1="606" x2="450" y2="636" stroke="#57606a" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 7 -->
  <rect x="175" y="638" width="550" height="64" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="664" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Registra o snapshot na planilha</text>
  <text x="450" y="685" text-anchor="middle" font-size="13" fill="#3a4a58">Histórico datado, para acompanhar tendências ao longo do tempo</text>

  <!-- Legend -->
  <rect x="230" y="740" width="16" height="16" rx="3" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="255" y="753" font-size="13" fill="#3a4a58">Etapa com IA generativa</text>
  <rect x="470" y="740" width="16" height="16" rx="3" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="495" y="753" font-size="13" fill="#3a4a58">Etapa mecânica / integração</text>
</svg>
