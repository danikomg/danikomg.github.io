<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="760" fill="#ffffff"/>

  <!-- Inputs -->
  <rect x="60" y="20" width="330" height="60" rx="10" fill="#fff8e6" stroke="#c9a227" stroke-width="2"/>
  <text x="225" y="46" text-anchor="middle" font-size="14" font-weight="600" fill="#6b5300">Novo território de palavra-chave</text>
  <text x="225" y="64" text-anchor="middle" font-size="12" fill="#3a4a58">(projeto de descoberta de territórios)</text>

  <rect x="510" y="20" width="330" height="60" rx="10" fill="#fff8e6" stroke="#c9a227" stroke-width="2"/>
  <text x="675" y="46" text-anchor="middle" font-size="14" font-weight="600" fill="#6b5300">Artigo já existente + auditoria</text>
  <text x="675" y="64" text-anchor="middle" font-size="12" fill="#3a4a58">(saída do SEO Audit Pro)</text>

  <line x1="225" y1="80" x2="440" y2="112" stroke="#57606a" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="675" y1="80" x2="460" y2="112" stroke="#57606a" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Agente 1 -->
  <rect x="175" y="114" width="550" height="86" rx="10" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="450" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#0b3d68">Agente 1 — Estrategista de Briefing</text>
  <text x="450" y="161" text-anchor="middle" font-size="13" fill="#3a4a58">Classifica o conteúdo (Preservar/Atualizar/Incluir/Remover),</text>
  <text x="450" y="179" text-anchor="middle" font-size="13" fill="#3a4a58">define estrutura H2/H3, FAQ e sugestão de CTA</text>
  <line x1="450" y1="200" x2="450" y2="230" stroke="#57606a" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Agente 2 -->
  <rect x="175" y="232" width="550" height="86" rx="10" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="450" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#0b3d68">Agente 2 — Redator com pesquisa profunda</text>
  <text x="450" y="279" text-anchor="middle" font-size="13" fill="#3a4a58">Segue o briefing à risca, pesquisa só em fontes oficiais</text>
  <text x="450" y="297" text-anchor="middle" font-size="13" fill="#3a4a58">(.gov.br / .jus.br), sinaliza [VERIFICAR] em vez de inventar</text>
  <line x1="450" y1="318" x2="450" y2="348" stroke="#57606a" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Agente 3 -->
  <rect x="175" y="350" width="550" height="86" rx="10" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="450" y="376" text-anchor="middle" font-size="15" font-weight="600" fill="#0b3d68">Agente 3 — Editor e voz editorial</text>
  <text x="450" y="397" text-anchor="middle" font-size="13" fill="#3a4a58">Aplica a voz da marca, quebra parágrafos, insere links internos</text>
  <text x="450" y="415" text-anchor="middle" font-size="13" fill="#3a4a58">aprovados, remove "cara de texto de IA"</text>
  <line x1="450" y1="436" x2="450" y2="466" stroke="#57606a" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Output -->
  <rect x="175" y="468" width="550" height="66" rx="10" fill="#e9f7ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="450" y="495" text-anchor="middle" font-size="15" font-weight="600" fill="#1e5c24">Artigo .md pronto para o repositório do blog</text>
  <text x="450" y="515" text-anchor="middle" font-size="13" fill="#3a4a58">Frontmatter completo, campos que exigem decisão humana marcados</text>

  <!-- Legend -->
  <rect x="200" y="580" width="16" height="16" rx="3" fill="#fff8e6" stroke="#c9a227" stroke-width="2"/>
  <text x="225" y="593" font-size="13" fill="#3a4a58">Ponto de entrada</text>
  <rect x="380" y="580" width="16" height="16" rx="3" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="405" y="593" font-size="13" fill="#3a4a58">Etapa com IA generativa</text>
  <rect x="580" y="580" width="16" height="16" rx="3" fill="#e9f7ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="605" y="593" font-size="13" fill="#3a4a58">Saída final</text>
</svg>
